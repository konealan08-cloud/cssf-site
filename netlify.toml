[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Node 20 n'est plus maintenu depuis avril 2026 : 22 est suivi jusqu'en avril 2027.
  NODE_VERSION = "22"

# En-tetes de securite, sur toutes les pages. La Content-Security-Policy est a
# part, dans dist/_headers, generee au build par scripts/csp.mjs.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Interdit d'afficher le site dans un cadre d'un autre site (clickjacking)
    X-Frame-Options = "DENY"
    # Le site n'a besoin d'aucune de ces fonctions du navigateur
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fichiers generes par Astro : leur nom contient une empreinte qui change a
# chaque modification. Le telephone peut donc les garder un an sans jamais
# redemander au serveur s'ils ont change (sans cela, chaque page revalidait
# CSS, JS, polices et photos, un aller-retour reseau par fichier).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# L'actualite « Resultats du BAC D 2026 » est devenue « Resultats 2026 ».
[[redirects]]
  from = "/actualites/resultats-bac-d-2026/"
  to = "/actualites/resultats-2026/"
  status = 301
