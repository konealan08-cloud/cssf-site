[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fichiers generes par Astro : leur nom contient une empreinte qui change a
# chaque modification. Le telephone peut donc les garder un an sans jamais
# redemander au serveur s'ils ont change (sans cela, chaque page revalidait
# CSS, JS, polices et photos, un aller-retour reseau par fichier).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
